<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="70%" stop-color="#040d1a"/>
      <stop offset="100%" stop-color="#02060d"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Cybernetic Hexagonal / Diamond Frame -->
  <polygon points="256,48 448,158 448,354 256,464 64,354 64,158" fill="none" stroke="#00d2ff" stroke-width="6" opacity="0.4"/>
  <polygon points="256,76 424,173 424,339 256,436 88,339 88,173" fill="none" stroke="url(#cyanLine)" stroke-width="8" filter="url(#glow)"/>

  <!-- Corner Brackets -->
  <path d="M 120,130 L 100,150 L 100,200" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 392,130 L 412,150 L 412,200" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 100,312 L 100,362 L 120,382" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 412,312 L 412,362 L 392,382" fill="none" stroke="#00ffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Central Shadow Monarch / System Eye Runes -->
  <!-- Left Eye -->
  <path d="M 160,230 Q 210,210 240,240 Q 200,255 160,230 Z" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="215" cy="232" r="6" fill="#ffffff"/>

  <!-- Right Eye -->
  <path d="M 352,230 Q 302,210 272,240 Q 312,255 352,230 Z" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="297" cy="232" r="6" fill="#ffffff"/>

  <!-- Holographic Core Cross / Calisthenics Bar Symbol -->
  <line x1="140" y1="290" x2="372" y2="290" stroke="url(#cyanLine)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="140" cy="290" r="10" fill="#00ffff"/>
  <circle cx="372" cy="290" r="10" fill="#00ffff"/>

  <!-- Vertical Core Alignment Indicator -->
  <line x1="256" y1="140" x2="256" y2="180" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="320" x2="256" y2="390" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
  <polygon points="256,400 250,385 262,385" fill="#00ffff"/>

  <!-- Subtle Rune Text -->
  <text x="256" y="340" font-family="'Chakra Petch', sans-serif" font-weight="bold" font-size="20" fill="#00d2ff" text-anchor="middle" letter-spacing="8" opacity="0.9">SYSTEM</text>
</svg>
